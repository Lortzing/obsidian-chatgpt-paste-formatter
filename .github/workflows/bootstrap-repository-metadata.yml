name: Bootstrap repository metadata

on:
  push:
    branches:
      - main
    paths:
      - .github/repository-metadata.trigger

permissions: write-all

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update repository description and topics
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          gh api --method PATCH "repos/$GH_REPO" \
            -f description='Obsidian plugin that repairs Markdown and MathJax copied from ChatGPT before it lands in your notes.'
          DESCRIPTION_STATUS=$?

          gh api --method PUT "repos/$GH_REPO/topics" \
            --input - <<'JSON'
          {"names":["obsidian","obsidian-plugin","chatgpt","markdown","latex","mathjax","clipboard","typescript","productivity"]}
          JSON
          TOPICS_STATUS=$?

          echo "description_status=$DESCRIPTION_STATUS" >> "$GITHUB_OUTPUT"
          echo "topics_status=$TOPICS_STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Clean up bootstrap files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/repository-metadata.trigger .github/workflows/bootstrap-repository-metadata.yml
          git rm -f .github/metadata-note.txt 2>/dev/null || true
          git commit -m "chore: clean up repository metadata bootstrap [skip ci]"
          git push origin HEAD:main
