name: Finalize 0.1.9 row-break repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply row-break parser and regression tests
        run: python .github/fix-0.1.9.py

      - name: Bump version to 0.1.9
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          package = Path('package.json')
          package_data = json.loads(package.read_text())
          package_data['version'] = '0.1.9'
          package.write_text(json.dumps(package_data, indent=2, ensure_ascii=False) + '\n')

          manifest = Path('manifest.json')
          manifest_data = json.loads(manifest.read_text())
          manifest_data['version'] = '0.1.9'
          manifest.write_text(json.dumps(manifest_data, indent=2, ensure_ascii=False) + '\n')

          versions = Path('versions.json')
          versions_data = json.loads(versions.read_text())
          versions_data['0.1.9'] = manifest_data['minAppVersion']
          versions.write_text(json.dumps(versions_data, indent=2, ensure_ascii=False) + '\n')
          PY
          npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Remove one-time helpers before validation
        run: |
          rm -f .github/fix-0.1.9.py
          rm -f .github/workflows/finalize-0.1.9.yml

      - name: Run full project checks
        run: npm run check

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair LaTeX row breaks in copied math environments"
          git push origin HEAD:main

      - name: Tag 0.1.9
        run: |
          git tag 0.1.9
          git push origin 0.1.9

      - name: Create release package
        run: zip -j chatgpt-paste-formatter-0.1.9.zip main.js manifest.json styles.css

      - name: Publish 0.1.9 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 0.1.9
          name: 0.1.9
          body: |
            - Repair ChatGPT-damaged single trailing backslashes into TeX `\\` row breaks inside matrix, cases, aligned, array, gathered, split, and related row environments.
            - Keep already-correct `\\` row breaks unchanged and avoid rewriting trailing backslashes outside row environments.
            - Add permanent regression coverage for the reported SVD matrix and piecewise-function cases.
          files: |
            main.js
            manifest.json
            styles.css
            chatgpt-paste-formatter-0.1.9.zip
