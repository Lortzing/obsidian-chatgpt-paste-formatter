name: Finalize v0.1.0

on:
  push:
    branches:
      - main
    paths:
      - .github/finalize-v0.1.0.trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize main
        run: git pull --rebase origin main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Test and build
        run: |
          npm test
          npm run build

      - name: Generate demo assets
        run: |
          python -m pip install --quiet pillow
          python scripts/generate-readme-demo.py

      - name: Ensure README references release and demo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          if 'assets/demo.gif' not in s:
              anchor = '> This project is currently in early development and is **not yet listed in Obsidian Community Plugins**.\n'
              demo = '''\n## Demo\n\n<p align="center">\n  <img src="assets/demo.gif" alt="ChatGPT Paste Formatter conversion demo" width="900">\n</p>\n\nThe demo illustrates the transformation performed by the plugin; it is a product preview rather than a screenshot of a specific Obsidian theme.\n'''
              if anchor in s:
                  s = s.replace(anchor, anchor + demo, 1)
          if 'img.shields.io/github/v/release/Lortzing/obsidian-chatgpt-paste-formatter' not in s:
              badge_anchor = '[![Obsidian](https://img.shields.io/badge/Obsidian-plugin-7C3AED?logo=obsidian&logoColor=white)](https://obsidian.md)\n'
              badge = '[![GitHub release](https://img.shields.io/github/v/release/Lortzing/obsidian-chatgpt-paste-formatter?display_name=tag)](https://github.com/Lortzing/obsidian-chatgpt-paste-formatter/releases/latest)\n'
              if badge_anchor in s:
                  s = s.replace(badge_anchor, badge_anchor + badge, 1)
          s = s.replace('- Publish packaged GitHub releases.\n', '')
          p.write_text(s)
          PY

      - name: Commit demo and clean up finalizer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/demo.gif assets/preview.png
          git rm -f .github/finalize-v0.1.0.trigger .github/workflows/finalize-v0.1.0.yml
          git commit -m "docs: add demo assets and finalize v0.1.0 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Package install ZIP
        run: zip -j chatgpt-paste-formatter-0.1.0.zip main.js manifest.json styles.css

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## ChatGPT Paste Formatter v0.1.0

          Initial public release of **ChatGPT Paste Formatter** for Obsidian.

          ### Highlights

          - Paste clipboard content with ChatGPT-to-Obsidian conversion.
          - Convert the current selection or entire note.
          - Preview changes before applying them.
          - Optional automatic paste detection.
          - Repair common damaged ChatGPT display-math forms such as `[ ... ]` and `# [ ... ]` blocks.
          - Convert `\\(...\\)` / `\\[...\\]` into Obsidian-friendly `$...$` / `$$...$$` math.
          - Normalize escaped math tokens inside detected math while protecting fenced and inline code.
          - Local-only conversion with no API keys, telemetry, or external services.

          ### Manual installation

          Download `chatgpt-paste-formatter-0.1.0.zip`, extract it, and place `main.js`, `manifest.json`, and `styles.css` in:

          ```text
          <Vault>/.obsidian/plugins/chatgpt-paste-formatter/
          ```

          Reload Obsidian and enable **ChatGPT Paste Formatter** under **Settings → Community plugins**.
          EOF

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release edit v0.1.0 --title "v0.1.0" --notes-file release-notes.md
            gh release upload v0.1.0 main.js manifest.json styles.css chatgpt-paste-formatter-0.1.0.zip --clobber
          else
            gh release create v0.1.0 \
              main.js manifest.json styles.css chatgpt-paste-formatter-0.1.0.zip \
              --target main \
              --title "v0.1.0" \
              --notes-file release-notes.md
          fi
