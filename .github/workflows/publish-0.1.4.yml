name: Publish 0.1.4 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify tag and source version
        shell: bash
        run: |
          test "$(node -p "require('./manifest.json').version")" = "0.1.4"
          git rev-parse 0.1.4 >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run check

      - name: Create release package
        shell: bash
        run: |
          mkdir -p release
          cp main.js manifest.json styles.css release/
          cd release
          zip ../chatgpt-paste-formatter-0.1.4.zip main.js manifest.json styles.css

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: 0.1.4
          name: 0.1.4
          body: |
            - Fix malformed ChatGPT display-math blocks containing compact expressions such as `e^{100}` and `U-m=[-2,-1,0]`.
            - Preserve the existing guard that leaves ordinary prose inside standalone brackets unchanged.
          files: |
            main.js
            manifest.json
            styles.css
            chatgpt-paste-formatter-0.1.4.zip

      - name: Remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-0.1.4.yml
          git commit -m "chore: remove 0.1.4 publisher"
          git push origin HEAD:main
