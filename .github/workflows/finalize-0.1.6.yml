name: Finalize 0.1.6

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply patch
        run: python .github/fix-0.1.6.py

      - name: Synchronize lockfile
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Verify implementation
        run: npm run check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/fix-0.1.6.py .github/workflows/finalize-0.1.6.yml
          git add src/converter.ts scripts/test-converter.mjs package.json package-lock.json manifest.json versions.json
          git commit -m "fix: recognize math heading artifacts in display blocks"
          git push origin HEAD:main

      - name: Tag 0.1.6
        run: |
          git tag 0.1.6
          git push origin 0.1.6
