name: Finalize 0.1.3 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Synchronize lockfile
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Verify implementation
        run: npm run check

      - name: Commit lockfile if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package-lock.json; then
            git add package-lock.json
            git commit -m "chore: sync lockfile for 0.1.3"
            git push origin HEAD:main
          fi

      - name: Create tag
        shell: bash
        run: |
          if git rev-parse 0.1.3 >/dev/null 2>&1; then
            echo "Tag 0.1.3 already exists."
            exit 1
          fi
          git tag 0.1.3
          git push origin 0.1.3

      - name: Create release package
        shell: bash
        run: |
          mkdir -p release
          cp main.js manifest.json styles.css release/
          cd release
          zip ../chatgpt-paste-formatter-0.1.3.zip main.js manifest.json styles.css

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: 0.1.3
          name: 0.1.3
          body: |
            - Raise the minimum supported Obsidian version to 1.7.2.
            - Refresh localized Command Palette commands immediately when the interface language changes.
          files: |
            main.js
            manifest.json
            styles.css
            chatgpt-paste-formatter-0.1.3.zip
