name: Finalize 0.1.1 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 0.1.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run check

      - name: Create release package
        shell: bash
        run: zip chatgpt-paste-formatter-0.1.1.zip main.js manifest.json styles.css

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.1.1 >/dev/null 2>&1; then
            echo 'Release 0.1.1 already exists.'
            exit 0
          fi
          gh release create 0.1.1 \
            main.js \
            manifest.json \
            styles.css \
            chatgpt-paste-formatter-0.1.1.zip \
            --title '0.1.1' \
            --notes 'Adds automatic English/Chinese UI localization for settings, commands, context menus, notices, and the conversion preview. The interface follows the current Obsidian language.'
