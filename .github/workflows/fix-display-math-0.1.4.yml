name: Fix display math regression 0.1.4

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Patch display-math detection and bump version
        shell: python
        run: |
          from pathlib import Path
          import json

          converter = Path('src/converter.ts')
          text = converter.read_text()
          old = """function looksLikeDisplayMath(lines: string[]): boolean {
            const body = lines.join('\\n').trim();
            if (!body) return false;

            let score = 0;
            if (/\\\\[A-Za-z]+/.test(body)) score += 2;
            if (/\\\\_/.test(body) || /[_^]/.test(body)) score += 1;
            if (/[=<>]/.test(body)) score += 1;
            if (/\\\\(?:frac|sum|int|boxed|operatorname|begin|end|log|sqrt)\\b/.test(body)) score += 2;
            if (/^[\\s\\S]{0,120}$/.test(body) && /[A-Za-z][A-Za-z0-9_{}'\\\\]*\\([^\\n]*\\)/.test(body)) score += 1;
            if (/^[A-Za-z][A-Za-z0-9_{}'\\\\]*(?:\\([^)]*\\))?\\s*[=<>]\\s*\\S[\\s\\S]*$/.test(body)) score += 1;

            return score >= 2;
          }
          """
          new = """function looksLikeDisplayMath(lines: string[]): boolean {
            const body = lines.join('\\n').trim();
            if (!body) return false;

            let score = 0;
            if (/\\\\[A-Za-z]+/.test(body)) score += 2;
            if (/\\\\_/.test(body) || /[_^]/.test(body)) score += 1;
            if (/[=<>]/.test(body)) score += 1;
            if (/\\\\(?:frac|sum|int|boxed|operatorname|begin|end|log|sqrt)\\b/.test(body)) score += 2;
            if (/^[\\s\\S]{0,120}$/.test(body) && /[A-Za-z][A-Za-z0-9_{}'\\\\]*\\([^\\n]*\\)/.test(body)) score += 1;
            if (/^[A-Za-z][A-Za-z0-9_{}'\\\\]*(?:\\([^)]*\\))?\\s*[=<>]\\s*\\S[\\s\\S]*$/.test(body)) score += 1;

            // ChatGPT clipboard corruption can leave display-math delimiters as bare
            // lines containing only '[' and ']'. Compact expressions such as
            // e^{100}, e^{1000}, e^{1001} or U-m=[-2,-1,0] carry only one of the
            // older heuristic signals, so give them one additional point without
            // accepting ordinary prose wrapped in standalone brackets.
            const compact = body.replace(/\\s+/g, '');
            const proseWordCount = body.match(/[A-Za-z]{4,}/g)?.length ?? 0;
            const compactMathExpression =
              compact.length <= 240 &&
              proseWordCount <= 1 &&
              /^[A-Za-z0-9\\\\_{}[\\](),.+\\-*/=<>|^'!:%]+$/.test(compact) &&
              /[_^=<>+\\-*/[\\]{}]/.test(compact);
            if (compactMathExpression) score += 1;

            return score >= 2;
          }
          """
          if old not in text:
            raise SystemExit('Expected looksLikeDisplayMath implementation was not found.')
          converter.write_text(text.replace(old, new))

          tests = Path('scripts/test-converter.mjs').read_text()
          for fixture in ('U-m=[-2,-1,0].', 'e^{100}', 'e^{1000}, e^{1001}, e^{1002}', 'This is ordinary prose.'):
            if fixture not in tests:
              raise SystemExit(f'Missing regression fixture: {fixture}')

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['version'] = '0.1.4'
          manifest['minAppVersion'] = '1.7.2'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['version'] = '0.1.4'
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n')

          versions_path = Path('versions.json')
          versions = json.loads(versions_path.read_text())
          versions['0.1.4'] = '1.7.2'
          versions_path.write_text(json.dumps(versions, indent=2, ensure_ascii=False) + '\n')

      - name: Synchronize lockfile
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Verify regression fix
        run: npm run check

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-display-math-0.1.4.yml
          git add src/converter.ts manifest.json versions.json package.json package-lock.json
          git commit -m "fix: recognize compact malformed display math"
          git push origin HEAD:main

      - name: Tag 0.1.4
        shell: bash
        run: |
          git tag 0.1.4
          git push origin 0.1.4
