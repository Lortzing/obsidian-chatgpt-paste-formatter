name: Finalize 0.1.8 boundary and coverage fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply parser and test-suite patch
        run: python .github/fix-0.1.8.py

      - name: Bump version to 0.1.8
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          package = Path('package.json')
          package_data = json.loads(package.read_text())
          package_data['version'] = '0.1.8'
          package.write_text(json.dumps(package_data, indent=2, ensure_ascii=False) + '\n')

          manifest = Path('manifest.json')
          manifest_data = json.loads(manifest.read_text())
          manifest_data['version'] = '0.1.8'
          manifest.write_text(json.dumps(manifest_data, indent=2, ensure_ascii=False) + '\n')

          versions = Path('versions.json')
          versions_data = json.loads(versions.read_text())
          versions_data['0.1.8'] = manifest_data['minAppVersion']
          versions.write_text(json.dumps(versions_data, indent=2, ensure_ascii=False) + '\n')
          PY
          npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Remove one-time release helpers before validation
        run: |
          rm -f .github/fix-0.1.8.py
          rm -f .github/workflows/finalize-0.1.8.yml

      - name: Run full project checks
        run: npm run check

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep adjacent math merges within real block boundaries"
          git push origin HEAD:main

      - name: Tag 0.1.8
        run: |
          git tag 0.1.8
          git push origin 0.1.8

      - name: Create release package
        run: zip -j chatgpt-paste-formatter-0.1.8.zip main.js manifest.json styles.css

      - name: Publish 0.1.8 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 0.1.8
          name: 0.1.8
          body: |
            - Replace regex-based adjacent-display merging with a delimiter-aware line parser so `gathered` can never swallow prose or unrelated math blocks.
            - Keep real rendered line breaks for genuinely adjacent derivation blocks.
            - Add a long mixed prose/math regression fixture from a real ChatGPT response.
            - Add behavioral tests for malformed-display, explicit-delimiter, escape-normalization, broken-relation, empty-emphasis, and inline-math mode settings.
            - Fix malformed-display disable behavior and protect explicit LaTeX delimiters when their conversion is disabled.
          files: |
            main.js
            manifest.json
            styles.css
            chatgpt-paste-formatter-0.1.8.zip
