name: Bootstrap v0.1.0 release

on:
  push:
    branches:
      - main
    paths:
      - .github/release-v0.1.0.trigger

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Test converter
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Generate README demo assets
        run: |
          python -m pip install --quiet pillow
          python scripts/generate-readme-demo.py

      - name: Commit demo assets and clean up bootstrap files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demo.gif assets/preview.png
          git rm -f .github/release-v0.1.0.trigger .github/workflows/bootstrap-release-v0.1.0.yml
          git commit -m "chore: add demo assets and finalize v0.1.0 release [skip ci]"
          git push origin HEAD:main

      - name: Package manual install ZIP
        run: zip -j chatgpt-paste-formatter-0.1.0.zip main.js manifest.json styles.css

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## ChatGPT Paste Formatter v0.1.0

          Initial public release of **ChatGPT Paste Formatter** for Obsidian.

          ### Highlights

          - Paste clipboard content with ChatGPT-to-Obsidian conversion.
          - Convert the current selection or the entire note.
          - Preview changes before applying them.
          - Optional automatic paste detection.
          - Repair common damaged ChatGPT display-math forms such as `[ ... ]` and `# [ ... ]` blocks.
          - Convert `\\(...\\)` / `\\[...\\]` to Obsidian-friendly `$...$` / `$$...$$` math.
          - Normalize escaped math tokens inside detected math while protecting fenced and inline code.
          - Local-only conversion with no API keys, telemetry, or external services.

          ### Manual installation

          Download `chatgpt-paste-formatter-0.1.0.zip`, extract it, and place `main.js`, `manifest.json`, and `styles.css` in:

          ```text
          <Vault>/.obsidian/plugins/chatgpt-paste-formatter/
          ```

          Reload Obsidian and enable **ChatGPT Paste Formatter** under **Settings → Community plugins**.
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release edit v0.1.0 --title "v0.1.0" --notes-file release-notes.md
            gh release upload v0.1.0 main.js manifest.json styles.css chatgpt-paste-formatter-0.1.0.zip --clobber
          else
            gh release create v0.1.0 \
              main.js manifest.json styles.css chatgpt-paste-formatter-0.1.0.zip \
              --target main \
              --title "v0.1.0" \
              --notes-file release-notes.md
          fi
