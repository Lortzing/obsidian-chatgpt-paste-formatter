name: Apply and release 0.1.2 fixes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply converter fixes and regression tests
        run: |
          echo '' | base64 --decode > /tmp/apply-0.1.2.py
          python /tmp/apply-0.1.2.py

      - run: npm ci

      - name: Verify implementation
        run: npm run check

      - name: Bump to 0.1.2
        run: npm version 0.1.2 --no-git-tag-version

      - name: Build release candidate
        run: npm run check

      - name: Commit changes and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ scripts/test-converter.mjs package.json package-lock.json manifest.json versions.json
          git commit -m "feat: add configurable repair rules and organized settings"
          git push origin HEAD:main
          git tag 0.1.2
          git push origin 0.1.2

      - name: Create release package
        run: zip chatgpt-paste-formatter-0.1.2.zip main.js manifest.json styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 0.1.2 main.js manifest.json styles.css chatgpt-paste-formatter-0.1.2.zip --title '0.1.2' --notes 'Adds selectable interface language, grouped settings, repeated-equals repair, adjacent derivation merging, improved simple display-math recognition, and separate automatic conversion notifications.'
