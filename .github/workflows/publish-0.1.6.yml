name: Publish 0.1.6

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run check

      - name: Create release package
        run: |
          zip chatgpt-paste-formatter-0.1.6.zip main.js manifest.json styles.css

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: 0.1.6
          name: 0.1.6
          body: |
            - Recognize math-like `# ...` lines inside damaged ChatGPT display-math blocks instead of rejecting the whole block as Markdown.
            - Strip the heading artifact before math normalization.
            - Add regression coverage for `\\Delta W`, repeated equals, `# -r\\frac{...}{...}`, and continuation lines.
          files: |
            main.js
            manifest.json
            styles.css
            chatgpt-paste-formatter-0.1.6.zip

      - name: Remove one-time publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-0.1.6.yml
          git commit -m "chore: remove 0.1.6 publisher"
          git push origin HEAD:main
